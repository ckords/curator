<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator</title>
    
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --background: #f4f7f6;
            --text: #333;
            --warning: #e74c3c;
            --sold: #7f8c8d;
        }
        body {
            font-family: 'Inter', sans-serif; 
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
            text-align: center;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #128f76;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        .stale-listing {
            color: var(--warning);
            font-weight: bold;
        }
        .status-sold {
            background-color: #f8f9fa;
            color: var(--sold);
            text-decoration: line-through;
        }
        .action-btn {
            font-size: 11px;
            padding: 5px 8px;
            margin-right: 4px;
            border-radius: 3px;
        }
        .btn-sold {
            background-color: #27ae60;
        }
        .btn-sold:hover {
            background-color: #1e8449;
        }
        .btn-delete {
            background-color: #e74c3c;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .btn-comps {
            background-color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Curator</h1>
    
    <div class="form-grid">
        <input type="text" id="itemName" placeholder="Item Name" required>
        <select id="platform">
            <option value="eBay">eBay</option>
            <option value="Facebook">Facebook Marketplace</option>
        </select>
        <input type="number" id="itemCost" placeholder="Cost ($)" step="0.01" required>
        <input type="number" id="listPrice" placeholder="List Price ($)" step="0.01" required>
        <input type="date" id="dateListed" required>
        <button onclick="addListing()">Add Item</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Status</th>
                <th>Item Name</th>
                <th>Platform</th>
                <th>Cost</th>
                <th>List Price</th>
                <th>Potential Margin</th>
                <th>Date Listed</th>
                <th>Days Active</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="inventoryBody">
            <!-- Listings will populate here -->
        </tbody>
    </table>
</div>

<!-- Load Supabase JS Library via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Initialize Supabase Connection
    const supabaseUrl = 'https://qlygxviynzwpkjmxlvmo.supabase.co';
    const supabaseKey = 'sb_publishable_bidLIrWAsKQZNjzURL_Iiw_UTLW_FrP'; 
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. Set default date in the form
    document.getElementById('dateListed').valueAsDate = new Date();

    // 3. Load saved listings when page opens
    document.addEventListener('DOMContentLoaded', fetchListings);

    // 4. Fetch listings from Supabase
    async function fetchListings() {
        const { data, error } = await supabaseClient
            .from('curator_listings')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('Error fetching inventory:', error);
            return;
        }
        renderTable(data);
    }

    // 5. Save new listing to Supabase
    async function addListing() {
        const name = document.getElementById('itemName').value;
        const platform = document.getElementById('platform').value;
        const cost = parseFloat(document.getElementById('itemCost').value);
        const price = parseFloat(document.getElementById('listPrice').value);
        const dateStr = document.getElementById('dateListed').value;

        if(!name || isNaN(cost) || isNaN(price) || !dateStr) {
            alert("Please fill out all fields.");
            return;
        }

        const margin = price - cost;
        const platformFee = platform === 'eBay' ? 13.25 : 0.00;

        const payload = {
            item_name: name,
            platform: platform,
            item_cost: cost,
            list_price: price,
            date_listed: dateStr,
            target_margin: margin,
            fee_percentage: platformFee,
            calculated_baseline: price,
            status: 'Active'
        };

        const { data, error } = await supabaseClient
            .from('curator_listings')
            .insert([payload]);

        if (error) {
            console.error('Error saving listing:', error);
            alert("Failed to save. Check console for details.");
            return;
        }

        document.getElementById('itemName').value = '';
        document.getElementById('itemCost').value = '';
        document.getElementById('listPrice').value = '';
        
        fetchListings(); 
    }

    // 6. Toggle Status (Mark as Sold / Active)
    async function toggleSold(id, currentStatus) {
        const newStatus = currentStatus === 'Sold' ? 'Active' : 'Sold';
        
        const { error } = await supabaseClient
            .from('curator_listings')
            .update({ status: newStatus })
            .eq('id', id);

        if (error) {
            console.error('Error updating status:', error);
            alert('Failed to update status.');
            return;
        }

        fetchListings();
    }

    // 7. Delete Item from Database
    async function deleteItem(id, name) {
        if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

        const { error } = await supabaseClient
            .from('curator_listings')
            .delete()
            .eq('id', id);

        if (error) {
            console.error('Error deleting item:', error);
            alert('Failed to delete item.');
            return;
        }

        fetchListings();
    }

    // 8. Render data into table
    function renderTable(inventoryData) {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = '';

        if (!inventoryData) return;

        inventoryData.forEach((item) => {
            const row = document.createElement('tr');
            
            const isSold = item.status === 'Sold';
            if (isSold) {
                row.classList.add('status-sold');
            }

            const listDate = new Date(item.date_listed);
            const today = new Date();
            const diffTime = Math.abs(today - listDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) - 1; 
            
            const daysClass = (!isSold && diffDays > 30) ? 'stale-listing' : '';

            row.innerHTML = `
                <td><strong>${item.status || 'Active'}</strong></td>
                <td>${item.item_name}</td>
                <td>${item.platform}</td>
                <td>$${item.item_cost.toFixed(2)}</td>
                <td>$${item.list_price.toFixed(2)}</td>
                <td>$${item.target_margin.toFixed(2)}</td>
                <td>${item.date_listed}</td>
                <td class="${daysClass}">${isSold ? '-' : diffDays + ' Days'}</td>
                <td>
                    <button class="action-btn btn-sold" onclick="toggleSold(${item.id}, '${item.status || 'Active'}')">
                        ${isSold ? 'Reactivate' : 'Mark Sold'}
                    </button>
                    <button class="action-btn btn-delete" onclick="deleteItem(${item.id}, '${item.item_name}')">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }
</script>

</body>
</html>
