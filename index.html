<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing & Inventory Tracker</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --background: #f4f7f6;
            --text: #333;
            --warning: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #128f76;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        .stale-listing {
            color: var(--warning);
            font-weight: bold;
        }
        .comps-btn {
            background-color: var(--primary);
            font-size: 12px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Inventory & Listing Tracker</h1>
    
    <div class="form-grid">
        <input type="text" id="itemName" placeholder="Item Name" required>
        <select id="platform">
            <option value="eBay">eBay</option>
            <option value="Facebook">Facebook Marketplace</option>
        </select>
        <input type="number" id="itemCost" placeholder="Cost ($)" step="0.01" required>
        <input type="number" id="listPrice" placeholder="List Price ($)" step="0.01" required>
        <input type="date" id="dateListed" required>
        <button onclick="addListing()">Add Item</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Platform</th>
                <th>Cost</th>
                <th>List Price</th>
                <th>Potential Margin</th>
                <th>Date Listed</th>
                <th>Days Active</th>
                <th>Research</th>
            </tr>
        </thead>
        <tbody id="inventoryBody">
            <!-- Listings will populate here -->
        </tbody>
    </table>
</div>

<script>
    // Set default date to today
    document.getElementById('dateListed').valueAsDate = new Date();

    let inventory = [];

    function addListing() {
        const name = document.getElementById('itemName').value;
        const platform = document.getElementById('platform').value;
        const cost = parseFloat(document.getElementById('itemCost').value);
        const price = parseFloat(document.getElementById('listPrice').value);
        const dateStr = document.getElementById('dateListed').value;

        if(!name || isNaN(cost) || isNaN(price) || !dateStr) {
            alert("Please fill out all fields.");
            return;
        }

        const margin = price - cost;
        const listDate = new Date(dateStr);
        const today = new Date();
        const diffTime = Math.abs(today - listDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) - 1; 

        const item = { name, platform, cost, price, margin, dateStr, diffDays };
        inventory.push(item);
        
        renderTable();
        
        // Reset specific form fields
        document.getElementById('itemName').value = '';
        document.getElementById('itemCost').value = '';
        document.getElementById('listPrice').value = '';
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = '';

        inventory.forEach((item, index) => {
            const row = document.createElement('tr');
            
            // Flag items listed for more than 30 days
            const daysClass = item.diffDays > 30 ? 'stale-listing' : '';

            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.platform}</td>
                <td>$${item.cost.toFixed(2)}</td>
                <td>$${item.price.toFixed(2)}</td>
                <td>$${item.margin.toFixed(2)}</td>
                <td>${item.dateStr}</td>
                <td class="${daysClass}">${item.diffDays} Days</td>
                <td><button class="comps-btn" onclick="searchComps('${item.name}')">Run Comps</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    function searchComps(itemName) {
        // Placeholder for future API integration
        alert("This will eventually ping the eBay API to find average sold prices for: " + itemName);
    }
</script>

</body>
</html>
